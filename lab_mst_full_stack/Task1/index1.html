<!DOCTYPE html>
<html>
<body>

<h2>Create Post</h2>

<form id="postForm">
  <input type="text" id="title" placeholder="Title" required><br><br>
  <textarea id="body" placeholder="Body" required></textarea><br><br>
  <button type="submit">Submit</button>
</form>

<p id="msg"></p>

<script>
document.getElementById("postForm").addEventListener("submit", function(e) {
  e.preventDefault();

  let title = document.getElementById("title").value;
  let body = document.getElementById("body").value;

  fetch("https://jsonplaceholder.typicode.com/posts", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      title: title,
      body: body
    })
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("msg").innerText = "Post submitted successfully!";
  })
  .catch(err => {
    document.getElementById("msg").innerText = "Error submitting post.";
  });
});
</script>

</body>
</html>
